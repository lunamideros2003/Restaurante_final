<div class="page-header">
  <h1>Gestión del Menú</h1>
  <p>Agrega un nuevo plato a la carta del restaurante.</p>
</div>

@if (mensaje(); as m) {
  <div class="alert" [class.alert--ok]="m.tipo === 'ok'" [class.alert--error]="m.tipo === 'error'">{{ m.texto }}</div>
}

<div class="card">
  <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-row">
      <label>Nombre del Plato * 
        <input formControlName="idProducto" placeholder="Ej: Pizza Margarita" />
      </label>
      <label>Precio * 
        <input formControlName="precio" type="number" step="0.01" min="0.01" placeholder="Ej: 25000" />
      </label>
    </div>

    <div class="form-row">
      <label>Categoría
        <select formControlName="categoriaId">
          <option value="">Seleccionar...</option>
          @for (cat of categorias(); track cat.id) {
            <option [value]="cat.id">{{ cat.nombre }}</option>
          }
        </select>
      </label>
    </div>

    <label>Descripción del Plato
      <textarea formControlName="resena" rows="3" placeholder="Describe los ingredientes y sabor del plato..."></textarea>
    </label>

    <div class="actions">
      <button type="submit" class="btn btn--primary">Guardar en la Carta</button>
      <a routerLink="/productos" class="btn btn--ghost">Volver a la Carta</a>
    </div>
  </form>
</div>
