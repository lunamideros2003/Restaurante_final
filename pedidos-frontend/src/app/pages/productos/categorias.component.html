<div class="page-header">
  <h1>Categorías del Restaurante</h1>
  <p>Gestiona las categorías de platos del menú.</p>
</div>

@if (mensaje(); as m) {
  <div class="alert" [class.alert--ok]="m.tipo === 'ok'" [class.alert--error]="m.tipo === 'error'">{{ m.texto }}</div>
}

<div class="card" style="margin-bottom:1rem">
  <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
    <label>Nombre de la Categoría * <input formControlName="nombre" placeholder="Ej: Platos Fuertes" /></label>
    <label>Descripción <input formControlName="descripcion" placeholder="Ej: Especialidades de la casa" /></label>
    <button type="submit" class="btn btn--primary">Crear categoría</button>
  </form>
</div>

<div class="card table-wrap">
  @if (categorias().length === 0) {
    <p class="empty">Sin categorías aún.</p>
  } @else {
    <table class="data-table">
      <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th></tr></thead>
      <tbody>
        @for (c of categorias(); track c.id) {
          <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.descripcion ?? '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
