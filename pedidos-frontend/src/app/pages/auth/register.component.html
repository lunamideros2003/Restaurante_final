<div class="auth-page">
  <div class="auth-card card">
    <h1>Crear cuenta de cliente</h1>
    <p>Regístrate para realizar pedidos. El ID de cliente se genera automáticamente.</p>

    @if (mensaje(); as m) {
      <div
        class="alert"
        [class.alert--ok]="m.tipo === 'ok'"
        [class.alert--error]="m.tipo === 'error'"
      >{{ m.texto }}</div>
    }

    <form class="form-grid" [formGroup]="form" (ngSubmit)="registrar()">
      <label>
        Nombre *
        <input formControlName="nombre" placeholder="Tu nombre" />
        @if (campoInvalido('nombre')) {
          <span class="field-error">El nombre es obligatorio</span>
        }
      </label>
      <label>
        Correo *
        <input formControlName="email" type="email" placeholder="tu@correo.com" />
        @if (campoInvalido('email')) {
          <span class="field-error">Correo válido obligatorio</span>
        }
      </label>
      <label>
        Contraseña *
        <input formControlName="password" type="password" placeholder="Mínimo 6 caracteres" />
        @if (campoInvalido('password')) {
          <span class="field-error">Mínimo 6 caracteres</span>
        }
      </label>
      <label>
        Confirmar contraseña *
        <input formControlName="confirmarPassword" type="password" />
        @if (campoInvalido('confirmarPassword')) {
          <span class="field-error">Repite la contraseña (mín. 6)</span>
        }
      </label>
      <label>
        Género
        <select formControlName="genero">
          <option value="femenino">Femenino</option>
          <option value="masculino">Masculino</option>
          <option value="otro">Otro</option>
        </select>
      </label>
      <label>
        Dirección
        <input formControlName="direccion" placeholder="Opcional" />
      </label>
      <button type="submit" class="btn btn--primary" [disabled]="enviando()">
        {{ enviando() ? 'Guardando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Iniciar sesión</a>
      (elige <strong>Cliente</strong> en el menú)
    </p>
  </div>
</div>
