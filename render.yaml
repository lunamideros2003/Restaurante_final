databases:
  - name: pedidos-postgres
    plan: free
    databaseName: pedidos
    user: pedidos
    region: oregon

services:
  - type: web
    name: sistema-pedidos-api
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pedidos-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: pedidos-postgres
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: pedidos-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,http://127.0.0.1:4200
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
