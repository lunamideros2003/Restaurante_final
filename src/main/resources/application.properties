server.port=${PORT:8080}

spring.application.name=delivery_app_aopr

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pedidos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pedidos}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

jwt.secret=${JWT_SECRET:PedidosUccSecretKey2026MuySeguraParaJwtTokens1234567890}
jwt.expiration-ms=86400000
